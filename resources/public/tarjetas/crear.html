<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>{{titulo}}</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/tarjeta_crear.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/footer.css">
        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/tarjeta_crear.js" defer></script>
    </head>
    <body class="layout-pro">
        {{include header}}
        <main class="main-content-pro container">
            <div class="tarjeta-wrapper animated-fadeIn">
                <h1 class="tarjeta-titulo">{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}
                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                <div class="tarjeta-card">
                    <form id="formCrearTarjeta" action="/tarjetas/crear" method="POST">

                        <div class="campo-grupo">
                            <label for="numeroTarjeta">Número de Tarjeta</label>
                            <input type="text" id="numeroTarjeta" name="numeroTarjeta" placeholder="Ej: 4111111111111111" required />
                        </div>

                        <div class="campo-grupo">
                            <label for="tipoTarjeta">Tipo de Tarjeta</label>
                            <select id="tipoTarjeta" name="tipoTarjeta" required>
                                <option value="">Seleccione un tipo</option>
                                <option value="DEBITO">Débito</option>
                                <option value="CREDITO">Crédito</option>
                            </select>
                        </div>

                        <div class="campo-grupo">
                            <label for="fechaExpedicionTarjeta">Fecha de Expedición</label>
                            <input type="datetime-local" id="fechaExpedicionTarjeta" name="fechaExpedicionTarjeta" required />
                        </div>

                        <div class="campo-grupo">
                            <label for="fechaVencimientoTarjeta">Fecha de Vencimiento</label>
                            <input type="datetime-local" id="fechaVencimientoTarjeta" name="fechaVencimientoTarjeta" required />
                        </div>

                        <div class="campo-grupo">
                            <label for="estadoTarjeta">Estado</label>
                            <select id="estadoTarjeta" name="estadoTarjeta" required>
                                <option value="">Seleccione un estado</option>
                                <option value="ACTIVA">Activa</option>
                                <option value="INACTIVA">Inactiva</option>
                                <option value="BLOQUEADA">Bloqueada</option>
                            </select>
                        </div>

                        <div class="campo-grupo">
                            <label for="idCliente">Cliente</label>
                            <select id="idCliente" name="idCliente" required>
                                <option value="">Seleccione un cliente</option>
                                {{#each clientes}}
                                <option value="{{idCliente}}">{{nombreCliente}}</option>
                                {{/each}}
                            </select>
                        </div>

                        <div class="campo-grupo">
                            <label for="idCuenta">Cuenta</label>
                            <select id="idCuenta" name="idCuenta" required>
                                <option value="">Seleccione una cuenta</option>
                                {{#each cuentas}}
                                <option value="{{idCuentaBancaria}}">{{numeroCuentaBancaria}} - {{cliente.nombreCliente}}</option>
                                {{/each}}
                            </select>
                        </div>

                        <button type="submit" class="btn-guardar">Registrar tarjeta</button>
                    </form>
                </div>
            </div>
        </main>
        {{include footer}}
    </body>
</html>
