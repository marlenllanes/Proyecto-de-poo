<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>Listado de ventas</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/venta_listar.css" />
                <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/footer.css">
         <style>
    /* Forzar que la celda y el contenedor organicen los iconos de lado a lado */
    .acciones-inline {
        display: flex !important;
        flex-direction: row !important; /* Línea horizontal */
        justify-content: center !important; /* Centrado en la celda */
        align-items: center !important;
        gap: 10px !important; /* Espacio de separación entre el celeste y el rosa */
        width: 100%;
    }

    /* Asegurar que los enlaces no se comporten como bloques completos */
    .btn-tabla-pro {
        display: inline-flex !important;
        margin: 0 !important;
        padding: 4px !important;
    }
</style>

        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/venta_crear.js" defer></script>
    </head>
    <body class="layout-pro">
        {{include header}}
        <main class="main-content-pro container">
            <div class="tabla-wrapper-pro animated-fadeIn">
                <h1>{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                <div class="tabla-card-pro">
                    <table class="tabla-pro">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre Cliente</th>
                                 <th>fechaVenta</th>
                                <th>totalVenta</th>
                                 <th>ivaVenta </th>
                                 <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            {{#each venta}}
                            <tr>
                                <td>{{idVenta}}</td>
                                <td>{{nombreCliente}}</td>
                                <td>{{fechaVenta}}</td>
                                <td>{{totalVenta}}</td>
                                <td>{{ivaVenta}}</td>
                                <td>
                                    <div class="acciones-inline">
                                    <a href="/venta/editar/{{idVenta}}" class="btn-pro editar">
                                        <img src="/assets/icon/edit.png" alt="actualizar"/>
                                    </a>

                                    <a href="/venta/eliminar/{{idVenta}}" 
                                       class="btn-pro eliminar"
                                       onclick="return confirm('¿Eliminar esta venta?');">
                                        <img src="/assets/icon/trash.png" alt="borrar"/>
                                    </a>
                                  </div>
                                </td>
                            </tr>
                            {{/each}}
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        {{include footer}}
    </body>
</html>
