<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>{{titulo}}</title>

        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/categoria_editar.css">
        

        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/categoria_editar.js" defer></script>
    </head>

    <body>

        {{include header}}

        <main class="main-content-pro container">
            <div class="editar-wrapper animated-fadeIn">
                <h1 class="titulo-categoria">{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                <form class="form-editar" action="/kiko/juda" method="POST">
                    <input type="hidden" id="idCategoria" name="idCategoria" value="{{idCategoria}}" />
                    <label for="nombreCategoria">Nombre de la categoría:</label>
                    <input type="text" id="nombreCategoria" name="nombreCategoria" value="{{nombreCategoria}}" />

                    <label for="estadoCategoria">Estado:</label>
                    <select id="estadoCategoria" name="estadoCategoria">
                        <option value="">Seleccione un estado</option>
                        <option value="true"  {{#if estadoCategoria}}selected{{/if}}>Activa</option>
                        <option value="false" {{#ifNot estadoCategoria}}selected{{/ifNot}}>Inactiva</option>

                    </select>

                    <button type="submit">Actualizar</button>
                </form>
            </div>
        </main>

    </body>
</html>
