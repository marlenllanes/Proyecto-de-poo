<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>{{titulo}}</title>

        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/cliente_editar.css">
        

        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/cliente_editar.js" defer></script>
    </head>

    <body>

        {{include header}}

        <main class="main-content-pro container">
            <div class="editar-wrapper animated-fadeIn">
                <h1 class="titulo-cliente">{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                <form class="form-editar" action="/elCliente/edit" method="POST">
                    <input type="hidden" id="idCliente" name="idCliente" value="{{idCliente}}" />
                    
                    <label for="nombreCliente">Nombre del cliente:</label>
                    <input type="text" id="nombreCliente" name="nombreCliente" value="{{nombreCliente}}" />
                    
                     <label for="documentoCliente">Documento del cliente:</label>
                    <input type="text" id="documentoCliente" name="documentoCliente" value="{{documentoCliente}}" />
                    
                    <label for="correoCliente">Correo del Cliente:</label>
                    <input type="text" id="correoCliente" name="correoCliente" value="{{correoCliente}}" />
                    
                    <label for="celularCliente">Celular del Cliente:</label>
                    <input type="text" id="celularCliente" name="celularCliente" value="{{celularCliente}}" />
                    
                    <label for="fechaNacimientoCliente">Fecha de nacimiento del Cliente:</label>
                    <input type="text" id="fechaNacimientoCliente" name="fechaNacimientoCliente" value="{{fechaNacimientoCliente}}" />
                    
                    <label for="direccionCliente">Direccion del cliente:</label>
                    <input type="text" id="direccionCliente" name="direccionCliente" value="{{direccionCliente}}" />

                    <button type="submit">Actualizar</button>
                </form>
            </div>
        </main>

    </body>
</html>
