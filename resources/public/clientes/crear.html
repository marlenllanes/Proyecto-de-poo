<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>{{titulo}}</title>

        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/cliente_crear.css">

        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/cliente_crear.js" defer></script>
    </head>

    <body>

        {{include header}}

        <main class="main-content-pro container">
            <div class="crear-wrapper animated-fadeIn">
                <h1 class="titulo-cliente">{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                <form class="form-crear" action="/losClien/crear" method="POST">
                   
                  
                    <label for="nombreCliente">Nombre del cliente:</label>
                    <input type="text" id="nombreCliente" name="nombreCliente"/>
                    
                    <label for="documentoCliente">Documento del cliente:</label>
                    <input type="text" id="documentoCliente" name="documentoCliente"/>
                    
                    <label for="correoCliente">Correo del Cliente:</label>
                    <input type="text" id="correoCliente" name="correoCliente"/>
                    
                    <label for="celularCliente">Celular del Cliente:</label>
                    <input type="text" id="celularCliente" name="celularCliente"/>
                    
                    <label for="fechaNacimientoCliente">Fecha de nacimiento del Cliente:</label>
                    <input type="date" id="fechaNacimientoCliente" name="fechaNacimientoCliente"/>
                    
                    <label for="direccionCliente">Direccion del cliente:</label>
                    <input type="text" id="direccionCliente" name="direccionCliente"/>
                    
                    <button type="submit">Guardar</button>
                </form>
            </div>
        </main>

    </body>
</html>
