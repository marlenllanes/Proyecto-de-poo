<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>{{titulo}}</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/sucursal_listar.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/footer.css">
            <style>
    /* Forzar que la celda y el contenedor organicen los iconos de lado a lado */
    .acciones-inline {
        display: flex !important;
        flex-direction: row !important; /* Línea horizontal */
        justify-content: center !important; /* Centrado en la celda */
        align-items: center !important;
        gap: 10px !important; /* Espacio de separación entre el celeste y el rosa */
        width: 100%;
    }

    /* Asegurar que los enlaces no se comporten como bloques completos */
    .btn-tabla-pro {
        display: inline-flex !important;
        margin: 0 !important;
        padding: 4px !important;
    }
</style>
        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/sucursal_crear.js" defer></script>
    </head>
    <body class="layout-pro">
        {{include header}}
        <main class="main-content-pro container">
            <div class="tabla-wrapper-pro animated-fadeIn">
                <h1>{{titulo}}</h1>
                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display='none'">✕</span>
                </div>
                {{/if}}
                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display='none'">✕</span>
                </div>
                {{/if}}
                <div class="tabla-card-pro">
                    <table class="tabla-pro">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Dirección</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            {{#each sucursal}}
                            <tr>
                                <td>{{idSucursal}}</td>
                                <td>{{nombreSucursal}}</td>
                                <td>{{direccionSucursal}}</td>
                                <td>{{telefonoSucursal}}</td>
                                <td>
                                    <div class="acciones-inline">
                                        <a href="/sucursal/editar/{{idSucursal}}" class="btn-pro editar">
                                            <img src="/assets/icon/edit.png" alt="editar"/>
                                        </a>
                                        <a href="/sucursal/eliminar/{{idSucursal}}"
                                           class="btn-pro eliminar"
                                           onclick="return confirm('¿Eliminar esta sucursal?');">
                                            <img src="/assets/icon/trash.png" alt="eliminar"/>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            {{/each}}
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        {{include footer}}
    </body>
</html>
