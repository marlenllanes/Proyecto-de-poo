<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>Nueva Cuenta Bancaria</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/cuentaBancaria_crear.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css" />
        <link rel="stylesheet" href="/assets/css/footer.css" />
        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/cuentaBancaria_crear.js" defer></script>
    </head>
    <body class="layout-pro">
        {{include header}}

        <main class="main-content-pro container">
            <div class="form-wrapper animated-fadeIn">
                <h1 class="titulo-cuenta">{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display='none'">✕</span>
                </div>
                {{/if}}

                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display='none'">✕</span>
                </div>
                {{/if}}

                <form action="/cuentas/crear" method="POST" class="form-cuenta" id="formCrearCuenta">

                    <label for="numeroCuentaBancaria">Número de cuenta:</label>
                    <div>
                        <input type="text" id="numeroCuentaBancaria" name="numeroCuentaBancaria" required />
                        <span class="msg-error" id="err-numero"></span>
                    </div>

                    <label for="tipoCuentaBancaria">Tipo de cuenta:</label>
                    <div>
                        <select id="tipoCuentaBancaria" name="tipoCuentaBancaria" required>
                            <option value="">Seleccione un tipo</option>
                            <option value="ahorros">Ahorros</option>
                            <option value="corriente">Corriente</option>
                        </select>
                        <span class="msg-error" id="err-tipo"></span>
                    </div>

                    <label for="saldoCuentaBancaria">Saldo inicial:</label>
                    <div>
                        <input type="number" step="0.01" id="saldoCuentaBancaria" name="saldoCuentaBancaria" required />
                        <span class="msg-error" id="err-saldo"></span>
                    </div>

                    <label for="fechaAperturaCuentaBancaria">Fecha de apertura:</label>
                    <div>
                        <input type="date" id="fechaAperturaCuentaBancaria" name="fechaAperturaCuentaBancaria" required />
                        <span class="msg-error" id="err-fecha"></span>
                    </div>
                    <label for="estadoCuentaBancaria">Estado:</label>
                    <div>
                        <select id="estadoCuentaBancaria" name="estadoCuentaBancaria" required>
                            <option value="">Seleccione un estado</option>
                            <option value="activa">Activa</option>
                            <option value="inactiva">Inactiva</option>
                            <option value="bloqueada">Bloqueada</option>
                        </select>
                        <span class="msg-error" id="err-estado"></span>
                    </div>

                    <label for="idCliente">Cliente:</label>
                    <div>
                        <select id="idCliente" name="idCliente" required>
                            <option value="">Seleccione un cliente</option>
                            {{#each listaClientes}}
                            <option value="{{idCliente}}">{{nombreCliente}}</option>
                            {{/each}}
                        </select>
                        <span class="msg-error" id="err-cliente"></span>
                    </div>

                    <button type="submit" class="btn-guardar">Guardar cuenta</button>
                </form>
            </div>
        </main>

        {{include footer}}
    </body>
</html>
