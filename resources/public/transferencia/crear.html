<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>{{titulo}}</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/transferencia_crear.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/footer.css">
        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/transferencia_crear.js" defer></script>
    </head>
    <body class="layout-pro">
        {{include header}}
        <main class="main-content-pro container">
            <div class="transferencia-wrapper animated-fadeIn">
                <h1 class="transferencia-titulo">{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display='none'">✕</span>
                </div>
                {{/if}}
                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display='none'">✕</span>
                </div>
                {{/if}}

                <div class="transferencia-card">
                    <form id="formCrearTransferencia" action="/transferencias/crear" method="POST">

                        <div class="campo-grupo">
                            <label for="idCuentaOrigen">Cuenta Origen</label>
                            <select id="idCuentaOrigen" name="idCuentaOrigen" required>
                                <option value="">Seleccione una cuenta</option>
                                {{#each cuentas}}
                                <option value="{{idCuentaBancaria}}">{{numeroCuentaBancaria}} - {{cliente.nombreCliente}}</option>
                                {{/each}}
                            </select>
                        </div>

                        <div class="campo-grupo">
                            <label for="idCuentaDestino">Cuenta Destino</label>
                            <select id="idCuentaDestino" name="idCuentaDestino" required>
                                <option value="">Seleccione una cuenta</option>
                                {{#each cuentas}}
                                <option value="{{idCuentaBancaria}}">{{numeroCuentaBancaria}} - {{cliente.nombreCliente}}</option>
                                {{/each}}
                            </select>
                        </div>

                        <div class="campo-grupo">
                            <label for="fechaTransferencia">Fecha</label>
                            <input type="date" id="fechaTransferencia" name="fechaTransferencia" required />
                        </div>

                        <div class="campo-grupo">
                            <label for="valorTransferencia">Valor</label>
                            <input type="number" id="valorTransferencia" name="valorTransferencia" placeholder="Ej: 500000" min="1" step="0.01" required />
                        </div>

                        <div class="campo-grupo">
                            <label for="descripcionTransferencia">Descripción</label>
                            <input type="text" id="descripcionTransferencia" name="descripcionTransferencia" placeholder="Ej: Pago de arriendo" />
                        </div>

                        <button type="submit" class="btn-guardar">Registrar transferencia</button>
                    </form>
                </div>
            </div>
        </main>
        {{include footer}}
    </body>
</html>
