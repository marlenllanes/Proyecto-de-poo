<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>Listado de Formas de pago</title>
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/formaPago_listar.css" />
                <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/footer.css">

        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/formaPago_crear.js" defer></script>
    </head>
    <body class="layout-pro">
        {{include header}}
        <main class="main-content-pro container">
            <div class="tabla-wrapper-pro animated-fadeIn">
                <h1>{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                <div class="tabla-card-pro">
                    <table class="tabla-pro">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre formaPago</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            {{#each formaPago}}
                            <tr>
                                <td>{{idFormaPago}}</td>
                                <td>{{nombreFormaPago}}</td>

                                <td>
                                    <a href="/formaPago/editar/{{idFormaPago}}" class="btn-pro editar">
                                        <img src="/assets/icon/edit.png" alt="actualizar"/>
                                    </a>

                                    <a href="/formaPago/eliminar/{{idFormaPago}}" 
                                       class="btn-pro eliminar"
                                       onclick="return confirm('¿Eliminar esta forma de pago?');">
                                        <img src="/assets/icon/trash.png" alt="borrar"/>
                                    </a>
                                </td>
                            </tr>
                            {{/each}}
                        </tbody>
                    </table>
                </div>
            </div>

        </main>

        {{include footer}}
    </body>
</html>
