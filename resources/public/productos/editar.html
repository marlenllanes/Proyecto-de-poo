<!doctype html> 
<html lang="es" data-theme="light"> 
<head> 
    <meta charset="utf-8" /> 
    <title>{{titulo}}</title> 
    <link rel="icon" type="image/x-icon" href="/favicon.ico" /> 
    <link rel="stylesheet" href="/assets/css/estilos.css" /> 
    <link rel="stylesheet" href="/assets/css/mensajeria.css"> 
    <link rel="stylesheet" href="/assets/css/producto_editar.css"> 
    <style>
    /* Forzar diseño vertical limpio y centrado para la edición */
    .form-editar {
        display: flex !important;
        flex-direction: column !important;
        gap: 15px !important;
        width: 100% !important;
    }
    .form-group {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        align-items: flex-start !important;
    }
    .form-group label {
        margin-bottom: 5px !important;
    }
       
    .form-editar input[type="text"],
    .form-editar input[type="number"],
    .form-editar select {
        width: 100% !important;
        box-sizing: border-box !important;
        padding: 10px !important;
        border: 1px solid #ccc !important; /* Borde gris suave */
        border-radius: 4px !important;
        font-size: 14px !important;
   
        background-color: #e1e1e1 !important; /* Color gris idéntico al campo "Nombre del producto" */
        color: #333333 !important; /* Color de texto gris oscuro/negro */
    }
    
</style>

    <script src="/assets/js/navegacion.js" defer></script> 
    <script src="/assets/js/theme-switch.js" defer></script> 
    <script src="/assets/js/producto_editar.js" defer></script> 
</head> 
<body> 
    {{include header}} 
    <main class="main-content-pro container"> 
        <div class="editar-wrapper animated-fadeIn"> 
            <h1 class="titulo-producto">{{titulo}}</h1> 
            
            {{#if msgExito}} 
            <div class="alerta-exito-pro"> 
                {{msgExito}} 
                <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span> 
            </div> 
            {{/if}} 
            
            {{#if msgError}} 
            <div class="alerta-error-pro"> 
                {{msgError}} 
                <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span> 
            </div> 
            {{/if}} 
            
            <form class="form-editar" action="/producto/actualizar" method="POST"> 
                <input type="hidden" id="idProducto" name="idProducto" value="{{idProducto}}" /> 
                
                <label for="nombreProducto">Nombre del producto:</label> 
                <input type="text" id="nombreProducto" name="nombreProducto" value="{{nombreProducto}}" /> 
                
                <div class="form-group"> 
                    <label for="categoriaProducto">Categoría:</label> 
                    <select id="categoriaProducto" name="categoriaProducto" required> 
                        <option value="">Seleccione una categoría</option> 
                        {{#each listaCategorias}} 
                        <option value="{{idCategoria}}">{{nombreCategoria}}</option> 
                        {{/each}} 
                    </select> 
                </div> 
                
                <div class="form-group"> 
                    <label for="proveedorProducto">Proveedor:</label> 
                    <select id="proveedorProducto" name="proveedorProducto" required> 
                        <option value="">Seleccione un proveedor</option> 
                        {{#each listaProveedores}} 
                        <option value="{{idProveedor}}">{{nombreProveedor}}</option> 
                        {{/each}} 
                    </select> 
                </div> 
                
                <!-- CORRECCIÓN: Agregar atributo value a los tres campos inferiores -->
                <div class="form-group"> 
                    <label for="precioProducto">Precio:</label> 
                    <input type="number" step="0.01" id="precioProducto" name="precioProducto" value="{{precioProducto}}" required /> 
                </div> 
                
                <div class="form-group"> 
                    <label for="costoProducto">Costo:</label> 
                    <input type="number" step="0.01" id="costoProducto" name="costoProducto" value="{{costoProducto}}" required /> 
                </div> 
                
                <div class="form-group"> 
                    <label for="cantidadProducto">Cantidad (Stock):</label> 
                    <input type="number" id="cantidadProducto" name="cantidadProducto" value="{{cantidadProducto}}" required /> 
                </div> 
                
                <button type="submit">Actualizar</button> 
            </form> 
        </div> 
    </main> 
</body> 
</html>
