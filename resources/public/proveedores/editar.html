<!doctype html>
<html lang="es" data-theme="light">
    <head>
        <meta charset="utf-8" />
        <title>{{titulo}}</title>

        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/assets/css/estilos.css" />
        <link rel="stylesheet" href="/assets/css/mensajeria.css">
        <link rel="stylesheet" href="/assets/css/proveedor_editar.css">
        

        <script src="/assets/js/navegacion.js" defer></script>
        <script src="/assets/js/theme-switch.js" defer></script>
        <script src="/assets/js/proveedor_editar.js" defer></script>
    </head>

    <body>

        {{include header}}

        <main class="main-content-pro container">
            <div class="editar-wrapper animated-fadeIn">
                <h1 class="titulo-proveedor">{{titulo}}</h1>

                {{#if msgExito}}
                <div class="alerta-exito-pro">
                    {{msgExito}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                {{#if msgError}}
                <div class="alerta-error-pro">
                    {{msgError}}
                    <span class="alerta-cerrar" onclick="this.parentElement.style.display = 'none'">✕</span>
                </div>
                {{/if}}

                <form class="form-editar" action="/elProvee/edit" method="POST">
                    <input type="hidden" id="idProveedor" name="idProveedor" value="{{idProveedor}}" />
                    
                    <label for="nombreProveedor">Nombre del proveedor:</label>
                    <input type="text" id="nombreProveedor" name="nombreProveedor" value="{{nombreProveedor}}" />
                    
                    <label for="correoProveedor">Correo del Proveedor:</label>
                    <input type="text" id="correoProveedor" name="correoProveedor" value="{{correoProveedor}}" />
                    
                    <label for="celularProveedor">Celular del Proveedor:</label>
                    <input type="text" id="celularProveedor" name="celularProveedor" value="{{celularProveedor}}" />

                    <button type="submit">Actualizar</button>
                </form>
            </div>
        </main>

    </body>
</html>
